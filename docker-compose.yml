# Local full-stack deployment:
#   docker compose up -d        (app + local mongodb)
# Secrets are passed through from your shell / .env (never baked in):
#   JWT_SECRET / ENCRYPTION_KEY / AI_INTEGRATIONS_OPENAI_API_KEY required.
services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/auditpilot
      # Secrets (REQUIRED — the app refuses to boot without them in production)
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET (32+ hex chars)}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY (64 hex chars)}
      - AI_INTEGRATIONS_OPENAI_API_KEY=${AI_INTEGRATIONS_OPENAI_API_KEY:-}
      - AI_INTEGRATIONS_OPENAI_BASE_URL=${AI_INTEGRATIONS_OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      - AI_MODEL_TRIAGE=${AI_MODEL_TRIAGE:-}
      - AI_MODEL_DEEP=${AI_MODEL_DEEP:-}
      # CORS allowlist + cookie policy (comma-separated browser origins)
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5000}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      # GitHub OAuth (optional until configured)
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Billing (optional until configured)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo-data:
